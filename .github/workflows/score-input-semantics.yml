name: Verify score input semantics

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/test-score-input-semantics.mjs"
      - ".github/workflows/score-input-semantics.yml"

permissions:
  contents: write

jobs:
  score-input-semantics:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Verify score input semantics
        shell: pwsh
        run: node ./scripts/test-score-input-semantics.mjs

      - name: Refresh tracked standalone HTML
        shell: pwsh
        run: |
          Copy-Item dist/index.html tuning-compare.html -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tuning-compare.html
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: refresh v1.0.0 standalone HTML"
            git fetch origin "${{ github.head_ref }}"
            git rebase "origin/${{ github.head_ref }}"
            git push origin HEAD:${{ github.head_ref }}
          }
