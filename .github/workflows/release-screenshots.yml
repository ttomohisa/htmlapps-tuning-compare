name: Capture v1.0.0 release screenshots

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "app.config.json"
      - "assets/favicon.svg"
      - "scripts/capture-release-screenshots.mjs"
      - ".github/workflows/release-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Build standalone HTML
        shell: pwsh
        run: ./build-standalone.ps1

      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Capture standalone screenshots
        shell: pwsh
        run: node ./scripts/capture-release-screenshots.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: v1.0.0-release-screenshots
          path: release-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated release assets
        shell: pwsh
        run: |
          Copy-Item release-screenshots/screenshot.png assets/screenshot.png -Force
          Copy-Item release-screenshots/screenshot-en.png assets/screenshot-en.png -Force
          Copy-Item release-screenshots/screenshot-mobile.png assets/screenshot-mobile.png -Force
          Copy-Item dist/index.html tuning-compare.html -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png tuning-compare.html
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: refresh v1.0.0 release assets"
            git push origin HEAD:${{ github.head_ref }}
          }
