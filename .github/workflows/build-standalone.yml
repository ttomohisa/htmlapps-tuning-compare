name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "app.config.json"
      - "assets/favicon.svg"
      - "dependencies.json"
      - "dependencies.lock.json"
      - "schemas/dependencies*.json"
      - ".github/workflows/dependency-updates.yml"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Check embedded release workflow PowerShell
        shell: pwsh
        run: |
          $lines = [System.IO.File]::ReadAllLines((Join-Path $PWD '.github/workflows/release.yml'))
          $count = 0
          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -cne '        run: |') { continue }
            $count++
            $body = New-Object 'System.Collections.Generic.List[string]'
            for ($j = $i + 1; $j -lt $lines.Length; $j++) {
              if ($lines[$j].StartsWith('          ')) { $body.Add($lines[$j].Substring(10)) }
              elseif ([string]::IsNullOrWhiteSpace($lines[$j])) { $body.Add('') }
              else { break }
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput(($body -join [Environment]::NewLine), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "release.yml script $count has invalid PowerShell: $($errors[0].Message)" }
          }
          if ($count -ne 3) { throw "Expected three PowerShell scripts in release.yml; got $count" }


      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Setup Node.js for regression tests
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run application regressions on source and standalone output
        shell: pwsh
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEST_HTML = Join-Path $PWD "dist/index.html"
          npm test --prefix tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            *.html
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14
